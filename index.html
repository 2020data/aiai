<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>人工智慧與演講紀錄典藏館</title>
  <meta name="description" content="當代藝廊極簡美學的人工智慧、數學方法與歷年演講紀錄典藏網站。" />
  <!-- Google Search Console 驗證標籤放置處：將下方註解取消並填入驗證碼 -->
  <!-- <meta name="google-site-verification" content="貼上你的_GSC_驗證碼" /> -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles/editorial.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <!-- 左側動態樹狀分類側邊欄 -->
      <div id="sidebar-root" class="lg:col-span-3"></div>

      <!-- 右側響應式封面視覺卡片牆 -->
      <section class="lg:col-span-9">
        <div class="flex flex-wrap items-end justify-between gap-2 pb-4 mb-6 hairline-b">
          <div>
            <p class="font-mono-index text-xs uppercase tracking-widest text-zinc-500" id="archive-kicker">CURATED COLLECTION</p>
            <h1 class="font-serif-editorial text-3xl font-semibold mt-0.5" id="archive-heading">全部典藏</h1>
          </div>
          <span class="font-mono-index text-xs text-zinc-500" id="archive-count"></span>
        </div>

        <div id="cards-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
          <div class="col-span-full text-sm text-zinc-500 py-12 text-center">載入典藏資料中...</div>
        </div>
      </section>
    </div>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { mountSidebar } from './components/sidebar.js';
    import { listPosts } from './modules/db.module.js';
    import { getCategoryById } from './config/categories.config.js';
    import { escapeHTML } from './modules/sanitizer.module.js';
    import { t } from './modules/i18n.module.js';

    const params = new URLSearchParams(window.location.search);
    const activeCat = params.get('cat') || '';
    const activeSub = params.get('sub') || '';

    await mountNavbar(activeCat);
    await mountSidebar({ activeCat, activeSub });

    const headingEl = document.getElementById('archive-heading');
    const kickerEl = document.getElementById('archive-kicker');
    const countEl = document.getElementById('archive-count');
    const gridEl = document.getElementById('cards-grid');

    if (activeCat) {
      const catInfo = getCategoryById(activeCat);
      headingEl.textContent = activeSub ? `${catInfo.label} / ${activeSub}` : catInfo.label;
      kickerEl.textContent = `CATEGORY ${catInfo.code}`;
      headingEl.style.color = catInfo.color;
    }

    try {
      const posts = await listPosts({ category: activeCat, subcategory: activeSub });
      countEl.textContent = `${posts.length} ENTRIES`;

      if (!posts.length) {
        gridEl.innerHTML = `<div class="col-span-full hairline-box p-10 text-center text-sm text-zinc-500">${t('noPosts')}</div>`;
      } else {
        gridEl.innerHTML = posts
          .map((post) => {
            const cat = getCategoryById(post.category);
            const dateStr = new Date(post.created_at).toLocaleDateString('zh-TW');
            const coverHtml = post.cover_image_url
              ? `<img src="${escapeHTML(post.cover_image_url)}" alt="${escapeHTML(post.title)}" class="w-full h-44 object-cover border-b border-[#D8D3C8]" loading="lazy" />`
              : `<div class="w-full h-44 flex items-center justify-center border-b border-[#D8D3C8] bg-[#EDE9E0]" style="border-top: 3px solid ${cat.color};">
                   <span class="font-serif-editorial text-4xl opacity-25">${cat.code}</span>
                 </div>`;

            const creatorHtml = post.creator_name
              ? `<span class="text-xs text-zinc-600">創作者：${escapeHTML(post.creator_name)}</span>`
              : '';

            return `
              <a href="./viewer.html?id=${encodeURIComponent(post.id)}" class="gallery-card block no-underline text-inherit flex flex-col">
                ${coverHtml}
                <div class="p-4 flex-1 flex flex-col justify-between gap-3">
                  <div>
                    <div class="flex flex-wrap items-center gap-1.5 mb-2">
                      <span class="text-[11px] font-medium px-2 py-0.5 text-[#F6F4EF]" style="background-color: ${cat.color};">
                        ${escapeHTML(cat.shortLabel)}
                      </span>
                      <span class="text-[11px] px-2 py-0.5 border border-[#D8D3C8] text-zinc-600">
                        ${escapeHTML(post.subcategory || '未分類')}
                      </span>
                      <span class="font-mono-index text-[10px] uppercase text-zinc-500 ml-auto" data-no-translate>
                        ${escapeHTML(post.format)} · ${escapeHTML(post.original_lang)}
                      </span>
                    </div>
                    <h2 class="font-serif-editorial text-xl font-semibold leading-snug line-clamp-2">
                      ${escapeHTML(post.title)}
                    </h2>
                  </div>
                  <div class="pt-2.5 hairline-t flex items-center justify-between text-[11px] text-zinc-500">
                    ${creatorHtml || '<span></span>'}
                    <span class="font-mono-index">${dateStr}</span>
                  </div>
                </div>
              </a>
            `;
          })
          .join('');
      }
    } catch (err) {
      gridEl.innerHTML = `<div class="col-span-full hairline-box p-6 text-sm text-red-800">資料讀取失敗，請確認 config/app.config.js 的 Supabase 設定：${escapeHTML(err.message)}</div>`;
    }
  </script>
</body>
</html>
