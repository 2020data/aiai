<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作者登入 — 人工智慧與演講紀錄典藏館</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles/editorial.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main class="max-w-md mx-auto px-4 py-14">
    <div class="hairline-box p-8">
      <p class="font-mono-index text-xs uppercase tracking-widest text-zinc-500">AUTHENTICATION</p>
      <h1 class="font-serif-editorial text-3xl font-semibold mt-1 mb-6">登入 / 註冊帳號</h1>

      <form id="auth-form" class="space-y-4">
        <div>
          <label class="block text-xs font-medium mb-1">電子郵件 Email</label>
          <input type="email" id="email" required class="editorial-input" placeholder="you@example.com" />
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">密碼（至少 6 碼）</label>
          <input type="password" id="password" required minlength="6" class="editorial-input" placeholder="••••••" />
        </div>

        <div id="auth-message" class="text-xs hidden p-3 border"></div>

        <div class="flex gap-3 pt-2">
          <button type="submit" id="btn-signin" class="editorial-btn flex-1">登入</button>
          <button type="button" id="btn-signup" class="editorial-btn-outline flex-1">註冊新帳號</button>
        </div>
      </form>
    </div>
  </main>

  <script type="module">
    import { mountNavbar } from './components/navbar.js';
    import { signIn, signUp } from './modules/auth.module.js';

    await mountNavbar();

    const form = document.getElementById('auth-form');
    const msgEl = document.getElementById('auth-message');

    function showMsg(text, isError = false) {
      msgEl.textContent = text;
      msgEl.className = `text-xs p-3 border ${isError ? 'border-red-700 text-red-800 bg-red-50' : 'border-emerald-800 text-emerald-900 bg-emerald-50'}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await signIn(document.getElementById('email').value, document.getElementById('password').value);
        window.location.href = './index.html';
      } catch (err) {
        showMsg(`登入失敗：${err.message}`, true);
      }
    });

    document.getElementById('btn-signup').addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || password.length < 6) {
        showMsg('請輸入有效 Email 與至少 6 碼密碼。', true);
        return;
      }
      try {
        await signUp(email, password);
        showMsg('註冊成功！若後台有啟用信箱驗證，請先至信箱點擊確認信後再登入。');
      } catch (err) {
        showMsg(`註冊失敗：${err.message}`, true);
      }
    });
  </script>
</body>
</html>
